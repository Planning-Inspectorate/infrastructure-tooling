trigger:
  branches:
    include:
      - main
      # trigger for merge queue branches
      - gh-readonly-queue/*
  paths:
    include:
      - infrastructure-agents

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - infrastructure-agents

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

extends:
  template: pipelines/terraform_checks.yml@templates
  workingDirectory: $(Build.Repository.LocalPath)/infrastructure-agents
  tflintConfigPath: $(Build.Repository.LocalPath)/.tflint.hcl
